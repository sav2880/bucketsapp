# Rust dependency policy: permissive licenses only (plan.md §14), known advisories fail.
[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

[advisories]
version = 2
ignore = [
  # Informational "unmaintained" notice, not a vulnerability. proc-macro-error is a build-time
  # dependency of gtk3-macros, which Tauri's Linux backend (wry) pulls in; we can't replace it.
  # Revisit when Tauri moves off gtk3 or the advisory changes.
  { id = "RUSTSEC-2024-0370", reason = "unmaintained build-time macro via Tauri's Linux gtk3 backend; no vulnerability" },
]

[licenses]
version = 2
# The allowlist is policy (plan.md §14), not just what is used today.
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "MPL-2.0",
  "Unicode-3.0",
  "CC0-1.0",
  "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
