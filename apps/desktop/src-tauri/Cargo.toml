[package]
name = "buckets-desktop"
version = "0.0.0"
description = "Buckets desktop shell (Tauri 2)"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "buckets_desktop_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
