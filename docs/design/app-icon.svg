<!-- Placeholder app icon (M0 draft): a rounded bucket with a handle and two paper slips peeking out. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Buckets app icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ac8fa"/>
      <stop offset="1" stop-color="#007aff"/>
    </linearGradient>
    <linearGradient id="bucket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe6f2"/>
    </linearGradient>
  </defs>
  <!-- squircle background (macOS-style; other platforms use the flat variant) -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- handle -->
  <path d="M312 470 C312 250 712 250 712 470" fill="none" stroke="#a3a7ad" stroke-width="40" stroke-linecap="round"/>
  <!-- slips -->
  <g>
    <rect x="352" y="300" width="190" height="230" rx="20" fill="#fffdf6" transform="rotate(-10 447 415)"/>
    <rect x="480" y="280" width="190" height="250" rx="20" fill="#fff4d6" transform="rotate(8 575 405)"/>
  </g>
  <!-- bucket body -->
  <path d="M236 470 H788 L726 800 Q716 850 666 850 H358 Q308 850 298 800 Z" fill="url(#bucket)"/>
  <!-- rim -->
  <rect x="216" y="440" width="592" height="64" rx="32" fill="#ffffff"/>
  <!-- friendly highlight band -->
  <path d="M290 600 H734" stroke="#007aff" stroke-opacity="0.18" stroke-width="36" stroke-linecap="round"/>
</svg>
